<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
    //  getFirestore  initializeFirestore  
    import { initializeFirestore, collection, query, onSnapshot, addDoc, setDoc, deleteDoc, doc, getDoc, getDocs, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

    //  VPN   Long Polling  initializeFirestore   
    const customGetFirestore = (app) => {
        return initializeFirestore(app, { experimentalForceLongPolling: true });
    };

    window.firebase = {
        initializeApp,
        getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
        getFirestore: customGetFirestore, //  mmh1.js  getFirestore     
        collection, query, onSnapshot, addDoc, setDoc, deleteDoc, doc, getDoc, getDocs, updateDoc, where
    };
    console.log(" Firebase SDK loaded with Long Polling enabled");
</script>
